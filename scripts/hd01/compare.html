<!doctype html><html lang="es"><meta charset="utf-8"><title>LIFE//SIM · Antes y después</title>
<style>body{margin:0;background:#11151c;color:#e8e3da;font:15px system-ui}header{display:flex;align-items:center;gap:16px;padding:16px;flex-wrap:wrap}select,button{padding:8px;background:#252b33;color:inherit;border:1px solid #626d78}a{color:#6fd0c6}.comparison{position:relative;width:1100px;max-width:100%;aspect-ratio:1100/680;overflow:hidden;margin:0 auto}.comparison img{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}#new{clip-path:inset(0 50% 0 0)}.line{position:absolute;left:50%;top:0;bottom:0;width:2px;background:#e8e3da;pointer-events:none}label{display:flex;align-items:center;gap:12px}input{width:260px}p{max-width:1100px;margin:16px auto;padding:0 16px;color:#a8b2bb;font-size:13px}</style>
<header><b>LIFE//SIM · HD-01</b><select id="scene"><option value="residential">Calle residencial</option><option value="commercial">Zona comercial</option><option value="interior">Interior</option><option value="metro">Metro</option><option value="stadium">Estadio</option><option value="night">Noche</option><option value="rain">Lluvia</option></select><label>Antes <input id="split" type="range" min="0" max="100" value="50" aria-label="Comparar antes y después"> Después</label><a href="/?quality=high" target="_blank">Jugar la vista previa</a></header>
<div class="comparison"><img id="old" alt="Antes de HD-01"><img id="new" alt="Después de HD-01"><span class="line"></span></div>
<p>Mismo encuadre, zoom, resolución, hora y semilla. El acabado conserva el diseño; los personajes y las partículas pueden estar en fases distintas de su animación. Sin commit ni publicación.</p>
<script>const s=document.querySelector('#scene'),r=document.querySelector('#split'),n=document.querySelector('#new');function load(){document.querySelector('#old').src='/__hd01/before-'+s.value+'-high-1100.png';n.src='/__hd01/after-'+s.value+'-high-1100.png'}s.onchange=load;r.oninput=()=>{n.style.clipPath='inset(0 '+(100-r.value)+'% 0 0)';document.querySelector('.line').style.left=r.value+'%'};load();</script></html>
