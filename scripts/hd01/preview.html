<!doctype html><html lang="es"><meta charset="utf-8"><title>LIFE//SIM · revisión HD-01</title>
<style>body{margin:0;background:#101319;color:#e8e3da;font:14px system-ui}header{padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select{padding:8px;color:inherit;background:#272d34;border:1px solid #657078}iframe{display:block;border:0;width:1100px;height:680px}pre{white-space:pre-wrap;font:12px monospace;padding:12px;max-width:1080px}main{display:flex;gap:12px}aside{width:210px}aside img{width:200px;image-rendering:pixelated}a{color:#6fd0c6}</style>
<header><b>LIFE//SIM · revisión local HD-01</b><label>Referencia <select id="phase"><option>after</option><option>before</option></select></label><select id="scene"><option>residential</option><option>commercial</option><option>interior</option><option>metro</option><option>stadium</option><option>pitch</option><option>night</option><option>rain</option></select><select id="quality"><option>high</option><option>medium</option><option>low</option></select><label>DPR emulado <select id="dpr"><option>1</option><option>1.25</option><option>2</option></select></label><button id="cycle">Probar calidades</button><button id="saveTest">Probar guardado anterior</button><button id="metroTest">Probar viaje en metro</button><button id="walk">Probar controles y puertas</button><a href="compare.html">Antes / después</a><button id="open">Cargar escena</button><button id="capture">Capturar y medir</button><button id="all">Capturar las siete</button><button id="phone">Vista 390 × 844</button><button id="desktop">Vista 1100 × 680</button><button id="play">Jugar / detener</button></header>
<main><div><iframe id="game"></iframe><pre id="result">Elige una escena. Las partidas de esta página son de prueba.</pre></div><aside id="refs"></aside></main>
<script type="module">
const frame=document.querySelector('iframe'),result=document.querySelector('pre'),scene=document.querySelector('#scene'),phase=document.querySelector('#phase'),quality=document.querySelector('#quality');let running=false,lastOpenMs=0;
const wait=(ms)=>new Promise(r=>setTimeout(r,ms));const sim=()=>frame.contentWindow.lifesim;
async function open(){const start=performance.now();frame.src='/?hd01='+scene.value+'&quality='+quality.value+'&dpr='+document.querySelector('#dpr').value+'&fresh='+Date.now();await new Promise(r=>frame.onload=r);for(let i=0;i<160&&!sim()?.game.scene.isActive('World');i++)await wait(100);if(!sim()?.game.scene.isActive('World'))throw Error('World no disponible');sim().services.clock.setPaused(true);sim().game.loop.sleep();let at=performance.now()+3000;for(let i=0;i<180;i++)sim().game.step(at+=16,16);lastOpenMs=performance.now()-start;result.textContent='Escena lista: '+scene.value;running=true;}
async function post(name,blob){const r=await fetch('/__hd01/'+name,{method:'POST',body:blob});if(!r.ok)throw Error(await r.text())}
const hash=(bytes,stride=1,offset=0)=>{let h=2166136261;for(let i=offset;i<bytes.length;i+=stride)h=Math.imul(h^bytes[i],16777619);return(h>>>0).toString(16)};
async function capture(){const l=sim(),g=l.game,w=g.scene.getScene('World');g.loop.sleep();const deltas=[];let tick=performance.now()+7000;for(let i=0;i<120;i++){const begin=performance.now();g.step(tick+=16,16);deltas.push(performance.now()-begin)}const a=deltas.slice(5).sort((a,b)=>a-b);const p=(q)=>a.length?+a[Math.min(a.length-1,Math.floor(a.length*q))].toFixed(3):null;
 const textures=[];for(const [key,t]of Object.entries(g.textures.list)){for(const src of t.source||[]){const image=src.image;if(!image)continue;const row={key,w:src.width||image.width||0,h:src.height||image.height||0,bytes:(src.width||image.width||0)*(src.height||image.height||0)*4};if((key.startsWith('player-')||key.startsWith('bs-')||key.startsWith('prop-')||key.startsWith('veh-'))&&image.getContext){try{const px=image.getContext('2d').getImageData(0,0,image.width,image.height).data;row.alpha=hash(px,4,3);row.rgb=hash(px)}catch{}}textures.push(row)}}
 const camera=w.cameras.main;const stats={scene:scene.value,phase:phase.value,seed:103,quality:quality.value,viewport:[frame.clientWidth,frame.clientHeight],dpr:frame.contentWindow.devicePixelRatio,dprMode:frame.contentWindow.hd01Dpr,sceneLoadMs:+lastOpenMs.toFixed(1),canvas:[g.canvas.width,g.canvas.height],zoom:camera.zoom,camera:[camera.scrollX,camera.scrollY],clock:[l.services.state.day,l.services.state.hour,l.services.state.minute],weather:scene.value==='rain'?'rain 0.8':'dry',samples:a.length,cpuFrameWorkMs:{median:p(.5),p95:p(.95),p99:p(.99)},textures:textures.length,textureBytesEstimated:textures.reduce((n,x)=>n+x.bytes,0),objects:w.children.length,hd:{size:l.hd.size,bytes:l.hd.bytes,pending:l.hd.pending},textureInventory:textures};
 const image=await new Promise(r=>{g.renderer.snapshot(im=>r(im.src),'image/png');g.step(tick+=16,16)});const blob=await(await fetch(image)).blob();const stem=[phase.value,scene.value,quality.value,frame.clientWidth].join('-')+(frame.contentWindow.devicePixelRatio===1?'':'-dpr'+String(frame.contentWindow.devicePixelRatio).replace('.','_'));await post(stem+'.png',blob);await post(stem+'.json',JSON.stringify(stats,null,2));g.loop.sleep();running=false;result.textContent=JSON.stringify({...stats,textureInventory:'guardado en JSON'},null,2);document.querySelector('aside').innerHTML=`<p>${stem}</p><a href="/__hd01/${stem}.png" target="_blank"><img src="/__hd01/${stem}.png"></a><p><a href="/__hd01/${stem}.json" target="_blank">Mediciones</a></p>`;return stats}
const run=(id,fn)=>document.getElementById(id).onclick=()=>fn().catch(e=>result.textContent=e.stack);

let testTime=performance.now()+20000;function step(n=1){const g=sim().game;g.loop.sleep();for(let i=0;i<n;i++){sim().services.clock.setPaused(true);g.step(testTime+=16,16)}}
function press(key,code,keyCode,n=4){frame.contentWindow.dispatchEvent(new KeyboardEvent('keydown',{key,code,keyCode,bubbles:true}));step(n);frame.contentWindow.dispatchEvent(new KeyboardEvent('keyup',{key,code,keyCode,bubbles:true}));step(2)}
run('cycle',async()=>{const l=sim(),rows=[];for(const pass of [0,1,2])for(const level of ['low','medium','high']){const at=performance.now();l.quality(level);step(150);l.services.clock.setPaused(true);step(30);const w=l.game.scene.getScene('World');rows.push({pass,level,ms:+(performance.now()-at).toFixed(2),textures:Object.keys(l.game.textures.list).length,hdBytes:l.hd.bytes,pending:l.hd.pending,objects:w.children.length,playerTexture:w.player.texture.key,body:[w.player.body.width,w.player.body.height]});await wait(0)}await post('quality-cycles.json',JSON.stringify(rows,null,2));result.textContent=JSON.stringify(rows,null,2)});
run('walk',async()=>{scene.value='commercial';await open();const l=sim(),rows=[];step(60);for(const [key,code,kc]of [['ArrowLeft','ArrowLeft',37],['ArrowRight','ArrowRight',39],['ArrowUp','ArrowUp',38],['ArrowDown','ArrowDown',40]]){const p=l.game.scene.getScene('World').player;const before=[p.x,p.y];press(key,code,kc,18);rows.push({direction:key,before,after:[p.x,p.y],facing:p.facing,texture:p.texture.key,body:[p.body.width,p.body.height]})}
 l.game.scene.getScene('World').teleport('district',{tx:41,ty:51},'up');step(100);press('ArrowUp','ArrowUp',38,3);press('e','KeyE',69);step(120);rows.push({action:'E enter',location:l.services.state.locationId});
 if(l.services.state.locationId==='home'){l.game.scene.getScene('World').teleport('home',{tx:10,ty:13},'down');step(90);press('ArrowDown','ArrowDown',40,3);press('e','KeyE',69);step(120);rows.push({action:'E exit',location:l.services.state.locationId})}
 const cycles=[];for(let pass=0;pass<10;pass++)for(const [loc,tx,ty]of [['home',10,10],['vallesco-station',11,8],['district',41,49]]){const start=performance.now();l.game.scene.getScene('World').teleport(loc,{tx,ty},'down');step(130);l.services.clock.setPaused(true);cycles.push({pass,loc,ms:+(performance.now()-start).toFixed(2),textures:Object.keys(l.game.textures.list).length,hdBytes:l.hd.bytes,pending:l.hd.pending,objects:l.game.scene.getScene('World').children.length});await wait(0)}
 await post('controls-and-scenes.json',JSON.stringify({controls:rows,cycles},null,2));result.textContent=JSON.stringify({controls:rows,cycles},null,2)});

run('metroTest',async()=>{scene.value='metro';await open();const l=sim();l.services.state.wallet={...l.services.state.wallet,cards:{...l.services.state.wallet.cards,transport:20}};l.game.scene.getScene('World').teleport('vallesco-station',{tx:11,ty:6},'up');step(100);let waited=0;for(;waited<3000&&!l.services.menu.isOpen;waited+=10){step(10);const m=l.game.scene.getScene('World').metro;if(m?.train?.state==='BOARDING'){press('ArrowUp','ArrowUp',38,3);press('e','KeyE',69)}if(waited%100===0)await wait(0)}const items=[...frame.contentWindow.document.querySelectorAll('#menu li.menu__item')].map(x=>x.innerText);const i=items.findIndex(x=>/Ribera Norte/.test(x));if(i>=0){press(String(i+1),'Digit'+(i+1),49+i);step(150)}const data={waitedFrames:waited,items,selected:i,location:l.services.state.locationId,card:l.services.state.wallet.cards.transport,dialogue:frame.contentWindow.document.querySelector('#dialogue').innerText,menu:frame.contentWindow.document.querySelector('#menu').innerText};await post('metro-trip.json',JSON.stringify(data,null,2));result.textContent=JSON.stringify(data,null,2)});

run('saveTest',async()=>{const l=sim(),old=l.services.state.snapshot;const fields=['money','energy','inventory','cards','housing','fitness','social','wardrobe','study','job','stories'];const before=structuredClone(old);delete old.agenda;l.services.save.save(old);l.services.save.save=()=>true;frame.src='/?hd01=residential&quality=high&restore=1&dpr='+document.querySelector('#dpr').value;await new Promise(r=>frame.onload=r);for(let i=0;i<160&&!sim()?.game.scene.isActive('World');i++)await wait(100);sim().game.loop.sleep();sim().services.clock.setPaused(true);const after=sim().services.state.snapshot;const canonical=o=>o&&typeof o==='object'?(Array.isArray(o)?o.map(canonical):Object.fromEntries(Object.keys(o).sort().map(k=>[k,canonical(o[k])]))):o;const differences=fields.filter(k=>JSON.stringify(canonical(before[k]))!==JSON.stringify(canonical(after[k])));const data={fields,differences,tour:after.agenda.tour,location:after.locationId,playerTexture:sim().game.scene.getScene('World').player.texture.key};await post('save-restore.json',JSON.stringify(data,null,2));result.textContent=JSON.stringify(data,null,2)});
run('open',open);run('capture',capture);run('all',async()=>{const reports=[];for(const name of [...scene.options].map(o=>o.value).filter(n=>n!=='pitch')){scene.value=name;await open();reports.push(await capture())}await post(phase.value+'-summary.json',JSON.stringify(reports,null,2));result.textContent='Siete referencias guardadas. '+phase.value;});
run('phone',async()=>{frame.style.width='390px';frame.style.height='844px';await open();frame.contentWindow.dispatchEvent(new PointerEvent('pointerdown',{pointerType:'touch',pointerId:1,bubbles:true}));step(2)});run('desktop',async()=>{frame.style.width='1100px';frame.style.height='680px';await open()});run('play',async()=>{running=!running;if(running)sim().game.loop.wake();else sim().game.loop.sleep()});await open();
</script></html>
