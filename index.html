<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.svg" />
    <title>LIFE//SIM</title>
  </head>
  <body>
    <div id="game"></div>
    <div id="overlay">
      <div id="hud"></div>
      <div id="hint"></div>
      <div id="touch" class="touch"></div>
      <div id="kick-drill" class="kick" hidden></div>
      <div id="spar-panel" class="kick spar" hidden></div>
      <div id="dialogue"></div>
      <div id="menu"></div>
      <div id="map" aria-label="Mapa"></div>
      <button id="map-button" class="hud-btn" type="button" aria-label="Abrir el mapa (M)"><span class="map-button__key">M</span><svg class="hud-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15"/></svg><span class="hud-btn__label">Mapa</span></button>
      <div id="phone"></div>
      <button id="phone-button" class="hud-btn" type="button" aria-label="Abrir el móvil (P)"><span class="map-button__key">P</span><svg class="hud-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 2h10v20H7zM11 18h2"/></svg><span class="hud-btn__label">Móvil</span></button>
      <button id="sound-button" class="hud-btn" type="button" aria-label="Volumen del ambiente (N)"><span class="map-button__key">N</span><span class="hud-btn__label">Sonido</span></button>
      <button id="bag-button" class="hud-btn" type="button" aria-label="Abrir la bolsa (I)"><span class="map-button__key">I</span><svg class="hud-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 8h14l-1 13H6zM9 8V6a3 3 0 0 1 6 0v2"/></svg><span class="hud-btn__label">Bolsa</span></button>
      <button id="pause-button" class="hud-btn" type="button" aria-label="Pausa: guardar o volver al inicio (Esc)"><span class="map-button__key">Esc</span><svg class="hud-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span class="hud-btn__label">Menú</span></button>
      <div id="phone-toast" role="status" aria-live="polite"></div>
      <pre id="metro-debug" hidden></pre>
      <div id="announce"></div>
      <div id="match-board" role="status" aria-live="polite" hidden></div>
      <p id="place"></p>
    </div>
    <div id="pause" class="title title--pause" hidden></div>
    <main id="title" class="title"></main>
    <script type="module" src="/src/title.ts"></script>
  </body>
</html>
